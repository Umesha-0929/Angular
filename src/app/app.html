<div class="page-shell">

  <header class="topbar">

    <div class="brand">
      <img src="/logo.svg" alt="EasyGo Logo">
    </div>

    <div class="menu">

      <a href="#">Home</a>
      <a href="#">About</a>
      <a href="#">Contact</a>

      <!-- Search -->
      <div class="search-box">

        <input
          #searchInput
          type="text"
          placeholder="Search products"
          (keyup.enter)="searchProduct(searchInput.value)"
        >

        <span
          class="search-icon"
          role="button"
          tabindex="0"
          (click)="searchProduct(searchInput.value)"
          (keyup.enter)="searchProduct(searchInput.value)"
        >
          ⌕
        </span>

      </div>

      <!-- Cart -->
      <div class="cart">

        🛒

        @if (cartCount > 0) {
          <span class="cart-count">
            {{ cartCount }}
          </span>
        }

      </div>

      <!-- Login -->
      <button
        type="button"
        class="login-btn"
      >
        Login
      </button>

    </div>

  </header>

  <!-- Product Component -->
 <app-product-component
  [searchText]="searchText"
  (cartCountChange)="updateCartCount($event)">
</app-product-component>

</div>
